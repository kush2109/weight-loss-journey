body(){const m=S.meas.slice().sort((a,b)=>a.d<b.d?-1:1),f=m[0],l=m[m.length-1],F=['waist','hips','chest','arm','thigh','fat'],ph=S.photos.slice().sort((a,b)=>a.d<b.d?-1:1);

est(){const T0=EST.reduce((a,x)=>({k:a.k+x.k*x.q,p:a.p+x.p*x.q,c:a.c+x.c*x.q,f:a.f+x.f*x.q}),{k:0,p:0,c:0,f:0}),ai=!!AIU();

<div><b>Estimated nutrition</b> <span class="m">(you can adjust)</span>${EST.map((x,i)=>`<div class="li"><span><span>${esc(x.n)}<br><span class="m">Carbs ${r1(x.c*x.q)} g · Protein ${r1(x.p*x.q)} g · Fat ${r1(x.f*x.q)} g</span></span></span><select style="width:auto" aria-label="Portion" onchange="EST[${i}].q=+this.value;render()">${[.5,1,1.5,2,3].map(q=>`<option value="${q}" ${q==x.q?'selected':''}>${q} ×</option>`).join('')}</select><b>${Math.round(x.k*x.q)} kcal</b><button class="x" aria-label="Remove" onclick="EST.splice(${i},1);render()">✕</button></div>`).join('')||'<p class="m">No foods yet. Analyze a photo or add foods below.</p>'}<div class="li" style="background:var(--soft);padding:10px;border-radius:8px"><b>Total (estimated)</b><b>${Math.round(T0.k)} kcal</b></div><p class="m">Carbs ${r1(T0.c)} g · Protein ${r1(T0.p)} g · Fat ${r1(T0.f)} g</p>
<div class="row"><div><label for="ea">Add a food</label><input id="ea" list="fl" placeholder="Type to search"><datalist id="fl">${FOODS.map(x=>`<option value="${x[0]}">`).join('')}</datalist></div><button class="p" onclick="estAdd()">Add</button></div><div class="row"><div><label for="em">Meal</label><select id="em">${['Breakfast','Lunch','Dinner','Snack'].map(x=>`<option ${x==mealNow()?'selected':''}>${x}</option>`).join('')}</select></div><button class="p" onclick="estSave()">Save to today's diary</button><button class="p" onclick="estReset()">Reset</button></div></div></div></div>`},
photos(){const ph=S.photos.slice().sort((a,b)=>a.d<b.d?-1:1);return`<div class="c"><h2>Progress Photos</h2><p class="m">Photos stay on this device only. Back up regularly.</p><div class="row"><div><label for="pp">Photo</label><input id="pp" type="file" accept="image/*"></div><div><label for="pn">Note</label><input id="pn" placeholder="Defaults to your current weight"></div><button class="p" onclick="addPhoto()">Add</button></div><div class="gal">${ph.map(x=>`<figure><img src="${x.img}" alt="Progress photo ${x.d}"><figcaption class="m">${x.d} ${esc(x.note||'')} <button class="x" aria-label="Delete" onclick="del('photos',${x.id})">✕</button></figcaption></figure>`).join('')}</div></div>`},
habits(){const hd=S.habits[td()]||[],D=[...Array(14)].map((_,i)=>ago(13-i));return`<div class="c"><h2>Daily Habits</h2><div class="hb">${HAB.map(h=>`<button class="${hd.includes(h[0])?'on':''}" onclick="hab('${h[0]}')">${hd.includes(h[0])?'✓ ':''}${h[1]}</button>`).join('')}</div></div><div class="c"><h2>Last 14 days</h2><table>${D.map(d=>{const n=(S.habits[d]||[]).length;return`<tr><td>${d}</td><td>${n}/7</td><td><div class="bar"><i style="width:${n/7*100}%"></i></div></td></tr>`}).join('')}</table></div>`},

bk(){return`<div class="c"><h2>Export / Backup</h2><div class="row"><button class="p" onclick="backup()">Download backup</button><button class="p" onclick="csv()">Download CSV</button><button class="p" onclick="print()">Print summary</button><div><label for="rs">Restore backup</label><input id="rs" type="file" accept=".json" onchange="restore(this)"></div></div><p class="m">Your data lives in this browser only. Last backup: ${S.lastBackup||'never'}</p></div>`},
settings(){return`<div class="c"><h2>Goal</h2><div class="row"><div><label for="gs">Start (kg)</label><input id="gs" type="number" step="0.1" value="${S.goal.start}"></div><div><label for="gt">Target (kg)</label><input id="gt" type="number" step="0.1" value="${S.goal.target}"></div><div><label for="gk">Daily kcal target</label><input id="gk" type="number" value="${S.goal.kcal}"></div><button class="p" onclick="setGoal()">Save goal</button></div></div><div class="c"><h2>AI food recognition</h2><p class="m">Paste your Worker URL from AI-SETUP.md. Meal photos you analyze are sent through your Worker to the AI service.</p><div class="row"><div><label for="au">Worker URL</label><input id="au" value="${esc(AIU())}" placeholder="https://your-worker.workers.dev"></div><button class="p" onclick="saveAI()">Save</button></div></div>`},
report(){const D=[...Array(7)].map((_,i)=>ago(i)),w=W().filter(x=>x.d>=D[6]),ch=w.length>1?r1(w[w.length-1].w-w[0].w):null,fd=D.filter(d=>dayFood(d).length),kc=fd.length?Math.round(fd.reduce((s,d)=>s+sum(dayFood(d),'kcal'),0)/fd.length):0,ac=S.act.filter(a=>a.d>=D[6]&&a.type!='Daily total'),hp=Math.round(D.reduce((s,d)=>s+(S.habits[d]||[]).length,0)/49*100),wd=new Set(ac.map(a=>a.d)).size;
const ins=[];if(ch!==null)ins.push(`Weight changed ${ch>0?'+':''}${ch} kg this week.`);if(wd)ins.push(`You were active on ${wd} of 7 days (${sum(ac,'min')} min).`);if(kc)ins.push(`You averaged ${kc} kcal on the ${fd.length} days you logged food.`);ins.push(`You completed ${hp}% of daily habits.`);if(streak()>=3)ins.push(`${streak()} days in a row. Keep it going.`);
return`<div class="c"><h2>Last 7 days</h2><ul>${ins.map(i=>`<li>${i}</li>`).join('')}</ul><p class="m">These are patterns in your own entries, not explanations for why your weight moved.</p></div>
<div class="c"><h2>Milestones</h2><div class="ms">${miles().map(m=>`<span class="${m[1]?'d':''}">${m[1]?'★ ':''}${m[0]}</span>`).join('')}</div></div>
${charts()}<div class="c noprint"><h2>Backup and export</h2><div class="row"><button class="p" onclick="backup()">Download backup</button><button class="p" onclick="csv()">Download CSV</button><button class="p" onclick="print()">Print summary</button><div><label for="rs">Restore backup</label><input id="rs" type="file" accept=".json" onchange="restore(this)"></div></div><p class="m">Your data lives in this browser only. Download a backup before clearing browser data or switching phones.</p></div>`}};
function render(){$('dt').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});$('nav').innerHTML=TABS.map(t=>`<button class="${T==t[0]?'on':''}" onclick="T='${t[0]}';render();scrollTo(0,0)">${t[1]}</button>`).join('');$('app').innerHTML=V[T]()}
function addW(vi,di){const w=parseFloat(val(vi));if(!w)return alert('Enter your weight in kg.');const d=di?val(di):td();S.weights=S.weights.filter(x=>x.d!=d);if(!S.goal.start)S.goal.start=w;add('weights',{d,w})}
function setGoal(){S.goal={start:val('gs'),target:val('gt'),kcal:val('gk')||1800};save();render()}
function hab(k){const d=td(),a=S.habits[d]||[];S.habits[d]=a.includes(k)?a.filter(x=>x!=k):a.concat(k);save();render()}
function pickImg(el){if(el.files[0])img(el.files[0],240,u=>{PI=u;$('pv').src=u;$('pv').style.display='block'})}
function addFood(){const i=FOODS.findIndex(x=>x[0]==val('fs')),q=parseFloat(val('fq'))||1;if(i<0)return alert('Pick a food from the list, or use "Add something not on the list".');add('food',mk(i,q,val('fm'),PI));PI=null}
function addCustom(){const k=parseFloat(val('ck'));if(!val('cn')||!k)return alert('Enter a name and calories.');add('food',{d:td(),meal:val('fm'),name:val('cn'),kcal:k,p:parseFloat(val('cp'))||0,c:0,f:0,img:PI,t:nowT()});PI=null}
function addAct(){if(!val('am')&&!val('as'))return alert('Enter minutes or steps.');add('act',{d:td(),type:val('at'),min:+val('am'),steps:+val('as'),kcal:+val('ak')})}
function addMeas(){const o={d:td()};['waist','hips','chest','arm','thigh','fat'].forEach(k=>o[k]=parseFloat(val('m_'+k))||0);add('meas',o)}
function addPhoto(){const f=$('pp').files[0];if(!f)return alert('Choose a photo first.');img(f,480,u=>add('photos',{d:td(),img:u,note:val('pn')||(cur()?cur()+' kg':'')}))}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function backup(){S.lastBackup=td();save();dl('my-journey-backup-'+td()+'.json',JSON.stringify(S),'application/json')}
function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',r=[['type','date','detail','value']];S.weights.forEach(x=>r.push(['weight',x.d,'kg',x.w]));S.food.forEach(x=>r.push(['food',x.d,x.name,Math.round(x.kcal)]));S.act.forEach(x=>r.push(['activity',x.d,x.type,x.min]));S.meas.forEach(x=>r.push(['measurements',x.d,'waist/hips/chest/arm/thigh',[x.waist,x.hips,x.chest,x.arm,x.thigh].join('/')]));dl('my-journey.csv',r.map(a=>a.map(q).join(',')).join('\n'),'text/csv')}
function restore(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(load(),JSON.parse(r.result));save();render();alert('Backup restored.')}catch(e){alert('That file is not a valid backup.')}};r.readAsText(f)}
const mk=(i,q,meal,im)=>{const x=FOODS[i];return{id:Date.now()+Math.floor(Math.random()*1e6),d:td(),meal,name:q+' × '+x[0],fi:i,q,kcal:x[1]*q,p:x[2]*q,c:x[3]*q,f:x[4]*q,img:im||null,t:nowT()}},mealNow=()=>{const h=new Date().getHours();return h<11?'Breakfast':h<16?'Lunch':h<19?'Snack':'Dinner'};
function many(a){S.food.push(...a);save();render()}
function qf(i){many([mk(i,1,mealNow())])}
function qm(i){many(S.meals[i].items.map(x=>mk(x.fi,x.q,mealNow())))}
function quick(){const n={};S.food.forEach(x=>{if(x.fi!=null)n[x.fi]=(n[x.fi]||0)+1});const top=Object.keys(n).sort((a,b)=>n[b]-n[a]).slice(0,6);if(!top.length&&!S.meals.length)return'';return`<div class="c"><h2>Quick add</h2><div class="hb">${top.map(i=>`<button onclick="qf(${i})">+ ${esc(FOODS[i][0])}</button>`).join('')}${S.meals.map((m,i)=>`<button onclick="qm(${i})">★ ${esc(m.name)}</button>`).join('')}</div></div>`}
function saveMeal(){const m=prompt('Which of today\'s meals should be saved? Breakfast, Lunch, Dinner or Snack','Breakfast'),it=dayFood(td()).filter(x=>x.meal==m&&x.fi!=null);if(!it.length)return alert('No items found for that meal today.');const name=prompt('Name this meal');if(!name)return;S.meals.push({name,items:it.map(x=>({fi:x.fi,q:x.q}))});save();render()}
function edF(id){const x=S.food.find(y=>y.id==id);if(x.fi==null){const k=parseFloat(prompt('Calories',x.kcal));if(k>=0){x.kcal=k;save();render()}return}const q=parseFloat(prompt('Servings',x.q));if(q>0){Object.assign(x,mk(x.fi,q,x.meal,x.img),{id:x.id,d:x.d});save();render()}}
function edW(id){const x=S.weights.find(y=>y.id==id),w=parseFloat(prompt('Weight (kg)',x.w));if(w>0){x.w=w;save();render()}}
function edA(id){const x=S.act.find(y=>y.id==id),m=parseFloat(prompt('Minutes',x.min));if(m>=0){x.min=m;save();render()}}
function nag(){if(S.weights.length+S.food.length<4)return'';const d=S.lastBackup,n=d?(new Date(td())-new Date(d))/864e5:99;if(n<7)return'';return`<div class="c warn"><b>Back up your data.</b> <span class="m">${d?'Last backup: '+d:'You have never backed up.'}</span> <button class="p" onclick="backup()">Download backup</button></div>`}
function setup(){if(S.goal.start&&S.goal.target)return'';return`<div class="c"><h2>Set up your plan</h2><div class="row"><div><label for="sh">Height (cm)</label><input id="sh" type="number"></div><div><label for="sa">Age</label><input id="sa" type="number"></div><div><label for="sx">Sex</label><select id="sx"><option value="f">Female</option><option value="m">Male</option></select></div></div><div class="row"><div><label for="sw">Weight now (kg)</label><input id="sw" type="number" step="0.1"></div><div><label for="st">Target (kg)</label><input id="st" type="number" step="0.1"></div><div><label for="sl">Activity</label><select id="sl"><option value="1.2">Mostly sitting</option><option value="1.375">Light exercise</option><option value="1.55">Active</option></select></div><button class="p" onclick="doSetup()">Create plan</button></div></div>`}
function doSetup(){const h=+val('sh'),a=+val('sa'),w=+val('sw'),t=+val('st'),m=val('sx')=='m';if(!(h&&a&&w&&t))return alert('Fill in every field.');const tdee=(10*w+6.25*h-5*a+(m?5:-161))*val('sl'),k=Math.round(Math.max(m?1500:1200,tdee-500)/10)*10;S.goal={start:w,target:t,kcal:k};S.prof={h,a,m};S.weights.push({id:Date.now(),d:td(),w});save();render();alert('Suggested target: about '+k+' kcal a day, which is roughly 0.5 kg loss per week. This is a general estimate, not medical advice. Check with a doctor if you have a health condition.')}
function bars(t,v,u){if(v.filter(Boolean).length<2)return'';const m=Math.max(...v)||1,w=560/v.length;return`<div class="c"><h2>${t}</h2><svg viewBox="0 0 600 110" role="img" aria-label="${t}">${v.map((x,i)=>`<rect x="${20+i*w+2}" y="${100-x/m*90}" width="${w-4}" height="${x/m*90}" rx="3" fill="var(--g)"/>`).join('')}</svg><p class="m">Highest: ${Math.round(m)} ${u}</p></div>`}
function charts(){const D=[...Array(14)].map((_,i)=>ago(13-i));return bars('Calories, last 14 days',D.map(d=>sum(dayFood(d),'kcal')),'kcal')+bars('Steps, last 14 days',D.map(d=>sum(S.act.filter(a=>a.d==d),'steps')),'steps')+bars('Waist (cm)',S.meas.slice().sort((a,b)=>a.d<b.d?-1:1).map(x=>x.waist).filter(Boolean).slice(-14),'cm')}
let RG=90,FD='t';try{document.documentElement.classList.toggle('dk',(localStorage.getItem('mj_dk')??(matchMedia('(prefers-color-scheme:dark)').matches?1:0))==1)}catch(e){}
const AIU=()=>{try{return localStorage.getItem('mj_ai')||''}catch(e){return''}},nowT=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),hc=k=>[...Array(7)].filter((_,i)=>(S.habits[ago(i)]||[]).includes(k)).length;
let EST=[],PB=null;
function saveAI(){try{localStorage.setItem('mj_ai',val('au').trim().replace(/\/$/,''))}catch(e){}alert('Saved.');render()}
function pickEst(el){const f=el.files[0];if(!f)return;img(f,240,u=>{PI=u});img(f,800,u=>{PB=u;render()})}
async function analyze(){const m=$('est-msg');m.textContent='Analyzing photo…';try{const r=await fetch(AIU()+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:PB.split(',')[1]})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');EST=EST.concat((j.items||[]).map(x=>({n:x.name,k:+x.kcal||0,p:+x.protein||0,c:+x.carbs||0,f:+x.fat||0,q:1})));if(!j.items||!j.items.length)alert('No food found in the photo. Add foods by hand.');render()}catch(e){m.textContent='Analysis failed: '+e.message}}
function estAdd(){const i=FOODS.findIndex(x=>x[0]==val('ea'));if(i<0)return alert('Pick a food from the list.');const x=FOODS[i];EST.push({n:x[0],k:x[1],p:x[2],c:x[3],f:x[4],q:1,fi:i});render()}
function estReset(){EST=[];PB=null;PI=null;render()}
function estSave(){if(!EST.length)return alert('Add at least one food.');const m=val('em'),a=EST.map((x,i)=>({id:Date.now()+i+Math.floor(Math.random()*1e6),d:td(),meal:m,name:(x.fi!=null||x.q!=1?x.q+' × ':'')+x.n,fi:x.fi,q:x.q,kcal:x.k*x.q,p:x.p*x.q,c:x.c*x.q,f:x.f*x.q,img:i==0?PI:null,t:nowT()}));EST=[];PB=null;PI=null;T='today';many(a)}
function dark(){const d=document.documentElement.classList.toggle('dk');try{localStorage.setItem('mj_dk',d?1:0)}catch(e){}}
function watchCard(){const t=S.act.find(a=>a.d==td()&&a.type=='Daily total'),st=t?t.steps:0;return`<div class="c"><h2>Today from my watch</h2><div class="bar"><i style="width:${Math.min(100,st/8000*100)}%"></i></div><p class="m">${st} of 8,000 steps. Copy the numbers from your watch app once a day.</p><div class="row"><div><label for="ws">Steps</label><input id="ws" type="number" value="${t?t.steps:''}"></div><div><label for="wm">Active minutes</label><input id="wm" type="number" value="${t?t.min:''}"></div><div><label for="wk">Calories burned</label><input id="wk" type="number" value="${t?t.kcal:''}"></div><button class="p" onclick="saveWatch()">Save</button></div></div>`}
function saveWatch(){const o={d:td(),type:'Daily total',steps:+val('ws'),min:+val('wm'),kcal:+val('wk')};S.act=S.act.filter(a=>!(a.d==td()&&a.type=='Daily total'));add('act',o)}
render();try{navigator.serviceWorker&&navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
